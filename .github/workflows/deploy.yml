name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push during a deploy supersedes it rather than queueing.
concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Page dates come from git log; a shallow clone carries no history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify Cloudflare SSR output layout
        run: |
          mkdir -p dist-ssr/assets
          entry="$(find dist-ssr -maxdepth 1 -name 'entry-server*.js' -print -quit)"
          test -n "$entry"
          mv "$entry" dist-ssr/assets/entry-server-cloudflare.js
          node scripts/prerender.mjs
      - name: Verify Wrangler deployment package
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
