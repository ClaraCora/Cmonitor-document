name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push during a deploy supersedes it rather than queueing.
concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Page dates come from git log; a shallow clone carries no history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
